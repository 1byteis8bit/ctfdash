[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ctfdash"
version = "0.1.0"
description = "Reusable terminal dashboard for CTFd-backed agent runs"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]

[project.scripts]
ctfdash = "ctfdash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

